# nginx/nginx.conf
server {
    listen 443 ssl; # Listen on port 443 for HTTPS
    listen [::]:443 ssl;

    server_name localhost; # Or your domain name

    # SSL configuration
    ssl_certificate /opt/docker/etc/nginx/ssl/localhost.crt; # Path to your SSL certificate
    ssl_certificate_key /opt/docker/etc/nginx/ssl/localhost.key; # Path to your SSL key

    # Strong SSL/TLS protocols and ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling off; # Set to 'on' if you have OCSP stapling configured
    ssl_stapling_verify off; # Set to 'on' if you have OCSP stapling configured

    # HSTS (optional, but recommended for production)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /app/public; # Root directory for your PHP application
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP scripts to PHP-FPM

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000; # Connect to the php-fpm service on port 9000
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300; # Increase timeout for longer PHP processes

        # fastcgi_buffers 8 128k; # 8 buffers of 128KB each
        # fastcgi_buffer_size 128k; # Size of the first buffer 
    }

    # Deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    location ~ /\.ht {
        deny all;
    }
}
